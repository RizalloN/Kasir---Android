name: kasir_super
description: "A modern offline-first real-time POS (Point of Sale) & Cashier App with Barista and Owner monitoring modes."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  print_bluetooth_thermal: ^1.2.5
  esc_pos_utils_plus: ^2.0.4
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

